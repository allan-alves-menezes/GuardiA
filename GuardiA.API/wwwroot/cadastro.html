<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuardiA — Cadastro de Cliente</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; padding: 40px; }
    .card { background: #1e293b; padding: 24px; border-radius: 10px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,.35); }
    h1 { margin-top: 0; font-size: 1.3rem; }
    label { display: block; margin-top: 12px; font-size: .9rem; color: #cbd5e1; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    button { margin-top: 18px; width: 100%; padding: 11px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    pre { margin-top: 16px; background: #0f172a; padding: 12px; border-radius: 6px; font-size: .82rem; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cadastro — GuardiA</h1>
    <form id="registerForm">
      <label for="name">Nome</label>
      <input id="name" name="name" type="text" required placeholder="Seu nome" />

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required placeholder="cliente@empresa.com" />

      <label for="password">Senha (mín. 6 caracteres)</label>
      <input id="password" name="password" type="password" minlength="6" required placeholder="••••••••" />

      <button type="submit">Cadastrar</button>
    </form>
    <pre id="result">Aguardando envio...</pre>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const resultEl = document.getElementById("result");
      resultEl.textContent = "Enviando...";

      const payload = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };

      try {
        const res = await fetch("/api/v1/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        resultEl.textContent = `Status ${res.status}:\n` + JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = "Erro de conexão: " + err.message;
      }
    });
  </script>
</body>
</html>
